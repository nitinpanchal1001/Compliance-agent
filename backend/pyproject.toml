[project]
name = "compliance-agent-backend"
version = "0.1.0"
description = "Autonomous Compliance Intelligence Agent — backend"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ──────────────────────────────────
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.0",

    # ── Auth ───────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",

    # ── Database ───────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",

    # ── Task queue ─────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # ── AI / Vector ────────────────────────────────────
    "openai>=1.50.0",
    "qdrant-client>=1.12.0",
    "litellm>=1.50.0",

    # ── Document parsing ───────────────────────────────
    "pypdf>=5.1.0",

    # ── Storage ────────────────────────────────────────
    "boto3>=1.35.0",

    # ── Observability ──────────────────────────────────
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; they're machine-generated, don't lint them.
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
